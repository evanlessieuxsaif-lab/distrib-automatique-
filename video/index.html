<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Friandeasy – vidéo de présentation (source)</title>
<!--
  Vidéo de présentation 25 s, 1920×1080, 30 i/s. Animations pilotées par une timeline JS déterministe :
  window.seek(t) place chaque élément à l'instant t (secondes). Rendu image par image : node render.js
  Aperçu dans le navigateur : ouvrir ce fichier avec ?play=1 (lecture en boucle).
  Identité du site : orange #FF7A3D, rose #FF4D6D (dégradé du logo), encre #2B2B33, fond crème #FFF8F0, Poppins.
-->
<style>
  @font-face { font-family: "Poppins"; font-weight: 800; src: url("fonts/Poppins-ExtraBold.ttf") format("truetype"); }
  @font-face { font-family: "Poppins"; font-weight: 600; src: url("fonts/Poppins-SemiBold.ttf") format("truetype"); }
  :root { --orange: #FF7A3D; --pink: #FF4D6D; --ink: #2B2B33; --cream: #FFF8F0; --grad: linear-gradient(135deg, var(--orange), var(--pink)); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--cream); }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--cream);
           font-family: "Poppins", sans-serif; color: var(--ink); }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .32; will-change: transform; }
  .blob--o { width: 900px; height: 900px; background: var(--orange); left: -300px; top: -350px; }
  .blob--p { width: 1000px; height: 1000px; background: var(--pink); right: -380px; bottom: -420px; }
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .el { will-change: transform, opacity; opacity: 0; }
  h1, .title { font-weight: 800; font-size: 120px; line-height: 1.08; letter-spacing: -.02em; }
  .title--m { font-size: 88px; }
  /* padding bas : le dégradé couvre aussi les jambages (g, p) au lieu de les couper */
  .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 .06em .16em; margin-bottom: -.16em; }
  .text { font-weight: 600; font-size: 48px; line-height: 1.3; }

  /* Scène 2 */
  .logo-h { width: 760px; height: auto; margin-bottom: 56px; }

  /* Scène 3 */
  .cats { display: flex; gap: 48px; margin-top: 64px; }
  .cat { width: 500px; height: 440px; border-radius: 40px; background: #fff; border: 4px solid transparent;
         box-shadow: 0 24px 60px rgba(43, 43, 51, .10); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
  .cat.is-on { border-color: var(--pink); box-shadow: 0 30px 70px rgba(255, 77, 109, .25); }
  .cat__ico { width: 200px; height: 200px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; }
  .cat__ico svg { width: 128px; height: 128px; }
  .cat__label { font-weight: 800; font-size: 52px; line-height: 1.1; padding: 0 20px; }

  /* Scène 4 */
  .resid { display: flex; align-items: center; gap: 110px; }
  .resid__art { position: relative; width: 560px; height: 640px; }
  .resid__art svg.building { position: absolute; left: 0; bottom: 0; width: 560px; height: 560px; }
  .pin { position: absolute; left: 50%; top: 0; width: 150px; height: 190px; margin-left: -75px; }
  .resid__txt { text-align: left; }
  .badge { display: inline-flex; align-items: center; gap: 22px; margin-top: 40px; padding: 18px 40px 18px 26px; border-radius: 999px;
           background: var(--grad); color: #fff; font-weight: 800; font-size: 72px; line-height: 1; }
  .badge svg { width: 76px; height: 76px; }

  /* Scène 5 */
  .icon-logo { width: 190px; height: 190px; margin-bottom: 48px; }
  .contact { margin-top: 44px; display: flex; flex-direction: column; gap: 18px; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 18px; font-weight: 600; font-size: 52px; padding: 14px 44px; border-radius: 999px; background: #fff;
          box-shadow: 0 16px 40px rgba(43, 43, 51, .08); }
  .pill svg { width: 52px; height: 52px; }
  .pill--grad { background: var(--grad); color: #fff; font-weight: 800; }
</style>
</head>
<body>
<div id="stage">
  <div class="blob blob--o" id="blobO"></div>
  <div class="blob blob--p" id="blobP"></div>

  <!-- 1. Accroche (0–3 s) -->
  <section class="scene" id="s1">
    <div id="s1group">
      <h1 class="el" id="s1a">Un petit creux&nbsp;?</h1>
      <h1 class="el grad" id="s1b">Une urgence&nbsp;?</h1>
    </div>
  </section>

  <!-- 2. Marque (3–8 s) -->
  <section class="scene" id="s2">
    <img class="el logo-h" id="s2logo" src="../assets/logo-horizontal.svg" alt="Friandeasy">
    <p class="el title title--m" id="s2a">Le distributeur</p>
    <p class="el title title--m grad" id="s2b">de votre résidence</p>
  </section>

  <!-- 3. Catégories (8–17 s) -->
  <section class="scene" id="s3">
    <p class="el title title--m" id="s3t">Dans votre distributeur</p>
    <div class="cats" id="cats">
      <div class="cat el" id="c1">
        <div class="cat__ico"><svg viewBox="0 0 100 100" aria-hidden="true"><!-- paquet de snacks -->
          <path d="M26 16h48l-4 10 4 10v46l-6 6H32l-6-6V36l4-10z" fill="#fff"/><path d="M26 16h48l-4 10H30z" fill="#FFD9C7"/>
          <circle cx="50" cy="58" r="14" fill="#FF7A3D"/><circle cx="50" cy="58" r="6" fill="#fff"/></svg></div>
        <div class="cat__label">Snacks</div>
      </div>
      <div class="cat el" id="c2">
        <div class="cat__ico"><svg viewBox="0 0 100 100" aria-hidden="true"><!-- produits du quotidien : tube + brosse -->
          <rect x="22" y="30" width="24" height="56" rx="6" fill="#fff"/><rect x="27" y="20" width="14" height="12" rx="3" fill="#FFD9C7"/>
          <rect x="22" y="52" width="24" height="12" fill="#FF7A3D"/>
          <rect x="60" y="34" width="10" height="54" rx="5" fill="#fff"/><rect x="58" y="12" width="14" height="26" rx="4" fill="#FFD9C7"/>
          <path d="M60 16h10M60 22h10M60 28h10" stroke="#FF4D6D" stroke-width="3" stroke-linecap="round"/></svg></div>
        <div class="cat__label">Produits du quotidien</div>
      </div>
      <div class="cat el" id="c3">
        <div class="cat__ico"><svg viewBox="0 0 100 100" aria-hidden="true"><!-- canette + bouteille -->
          <rect x="18" y="30" width="30" height="56" rx="7" fill="#fff"/><rect x="18" y="48" width="30" height="20" fill="#FF4D6D"/><rect x="24" y="26" width="18" height="5" rx="2" fill="#FFD9C7"/>
          <path d="M62 24h14v8l6 10v38a6 6 0 0 1-6 6H62a6 6 0 0 1-6-6V42l6-10z" fill="#fff"/><rect x="61" y="14" width="16" height="10" rx="3" fill="#FFD9C7"/>
          <rect x="56" y="54" width="26" height="14" fill="#FF7A3D"/></svg></div>
        <div class="cat__label">Boissons</div>
      </div>
    </div>
  </section>

  <!-- 4. Résidences 24h/24 (17–22 s) -->
  <section class="scene" id="s4">
    <div class="resid">
      <div class="resid__art el" id="s4art">
        <svg class="building" viewBox="0 0 560 560" aria-hidden="true">
          <rect x="60" y="120" width="300" height="440" rx="18" fill="#2B2B33"/>
          <rect x="330" y="230" width="190" height="330" rx="18" fill="#3A3A45"/>
          <rect x="60" y="100" width="300" height="34" rx="10" fill="#FF4D6D"/>
          <g id="win"></g>
          <rect x="170" y="470" width="80" height="90" rx="10" fill="#FF7A3D"/>
          <rect x="0" y="548" width="560" height="12" rx="6" fill="#2B2B33" opacity=".25"/>
        </svg>
        <svg class="pin" id="s4pin" viewBox="0 0 150 190" aria-hidden="true">
          <defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A3D"/><stop offset="1" stop-color="#FF4D6D"/></linearGradient></defs>
          <path d="M75 186S10 112 10 68a65 65 0 0 1 130 0c0 44-65 118-65 118z" fill="url(#pg)"/>
          <circle cx="75" cy="68" r="26" fill="#fff"/>
        </svg>
      </div>
      <div class="resid__txt">
        <p class="el title title--m" id="s4a">Dans les résidences</p>
        <p class="el title title--m" id="s4b">étudiantes</p>
        <div class="el badge" id="s4c"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M12 6.5V12l3.8 2.4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>24h/24</div>
      </div>
    </div>
  </section>

  <!-- 5. Contact (22–25 s) -->
  <section class="scene" id="s5">
    <img class="el icon-logo" id="s5logo" src="../assets/favicon.svg" alt="">
    <p class="el title title--m" id="s5a">N'hésitez pas à nous contacter</p>
    <div class="contact">
      <div class="el pill" id="s5b"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="#FF4D6D" stroke-width="2"/><path d="M4 7l8 6 8-6" fill="none" stroke="#FF4D6D" stroke-width="2" stroke-linejoin="round"/></svg>contact@friandeasy.fr</div>
      <div class="el pill pill--grad" id="s5c">friandeasy.fr</div>
    </div>
  </section>
</div>

<script>
(() => {
  const DURATION = 25, FPS = 30, TR = 0.3;               // transitions de 0,3 s
  // Courbe cubic-bezier(.22, 1, .36, 1) (sortie douce), résolue numériquement
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const X = t => ((ax * t + bx) * t + cx) * t, Y = t => ((ay * t + by) * t + cy) * t, dX = t => (3 * ax * t + 2 * bx) * t + cx;
    return x => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x; for (let i = 0; i < 8; i++) { const d = dX(t); if (Math.abs(d) < 1e-6) break; t -= (X(t) - x) / d; } return Y(Math.min(1, Math.max(0, t))); };
  }
  const easeOut = bezier(.22, 1, .36, 1), easeIn = bezier(.55, 0, .78, .34), easeInOut = bezier(.65, 0, .35, 1);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const $ = id => document.getElementById(id);

  // Entrée à tIn, sortie à tOut (chacune dure TR). Renvoie 0..1 (visibilité) + phase.
  function vis(t, tIn, tOut) {
    if (t < tIn || t >= tOut + TR) return { v: 0, k: 'off' };
    if (t < tIn + TR) return { v: easeOut((t - tIn) / TR), k: 'in' };
    if (t >= tOut) return { v: 1 - easeIn((t - tOut) / TR), k: 'out' };
    return { v: 1, k: 'on' };
  }
  // Applique une entrée « fondu + glissé (+ zoom) »
  function apply(el, t, tIn, tOut, o = {}) {
    const s = vis(t, tIn, tOut), dy = o.dy ?? 40, z0 = o.z0 ?? 1, z1 = o.z1 ?? 1;
    el.style.opacity = s.v;
    const y = s.k === 'in' ? (1 - s.v) * dy : s.k === 'out' ? -(1 - s.v) * dy * .6 : 0;
    const z = s.k === 'in' ? z0 + (1 - z0) * s.v : s.k === 'out' ? 1 + (z1 - 1) * (1 - s.v) : 1;
    el.style.transform = `translateY(${y}px) scale(${z})`;
    return s;
  }

  // Fenêtres de l'immeuble (générées) : elles s'allument une à une
  const win = $('win'), WINS = [];
  for (let r = 0; r < 6; r++) for (let c = 0; c < 4; c++) {
    const w = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    w.setAttribute('x', 88 + c * 66); w.setAttribute('y', 160 + r * 50); w.setAttribute('width', 42); w.setAttribute('height', 30); w.setAttribute('rx', 6);
    win.appendChild(w); WINS.push(w);
  }
  for (let r = 0; r < 5; r++) for (let c = 0; c < 2; c++) {
    const w = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    w.setAttribute('x', 366 + c * 70); w.setAttribute('y', 262 + r * 52); w.setAttribute('width', 46); w.setAttribute('height', 30); w.setAttribute('rx', 6);
    win.appendChild(w); WINS.push(w);
  }
  const ORDER = WINS.map((_, i) => (i * 7) % WINS.length);   // ordre d'allumage pseudo-aléatoire, déterministe

  function seek(t) {
    t = ((t % DURATION) + DURATION) % DURATION;
    // Fond : deux halos qui dérivent en boucle (période = durée de la vidéo)
    const a = t / DURATION * Math.PI * 2;
    $('blobO').style.transform = `translate(${Math.sin(a) * 120}px, ${Math.cos(a) * 80}px)`;
    $('blobP').style.transform = `translate(${-Math.sin(a) * 140}px, ${-Math.cos(a) * 60 + 60}px)`;

    // 1. Accroche : fondu + zoom, léger zoom continu du groupe
    apply($('s1a'), t, 0, 2.7, { dy: 0, z0: 1.25, z1: 1.15 });
    apply($('s1b'), t, 1.3, 2.7, { dy: 0, z0: 1.25, z1: 1.15 });
    $('s1group').style.transform = `scale(${1 + .06 * clamp(t / 3)})`;

    // 2. Marque
    apply($('s2logo'), t, 3.0, 7.7, { dy: 30, z0: .9 });
    apply($('s2a'), t, 3.3, 7.7);
    apply($('s2b'), t, 3.6, 7.7);

    // 3. Catégories, une toutes les 3 s ; la catégorie courante est mise en avant
    apply($('s3t'), t, 8.0, 16.7);
    // la rangée reste centrée sur les cartes déjà apparues
    const k = easeOut(clamp((t - 11.0) / TR)) + easeOut(clamp((t - 13.7) / TR));
    $('cats').style.transform = `translateX(${(2 - k) * (500 + 48) / 2}px)`;
    [['c1', 8.3], ['c2', 11.0], ['c3', 13.7]].forEach(([id, t0], i, arr) => {
      const el = $(id), s = vis(t, t0, 16.7);
      const next = arr[i + 1] ? arr[i + 1][1] : 16.7;
      const on = t >= t0 && t < next;
      const focus = on ? easeOut(clamp((t - t0) / TR)) : (t >= next && t < 16.7 ? 1 - easeOut(clamp((t - next) / TR)) : 0);
      el.classList.toggle('is-on', on);
      el.style.opacity = s.k === 'on' ? (.7 + .3 * focus) : s.v * (s.k === 'out' ? .7 : 1);
      const y = s.k === 'in' ? (1 - s.v) * 80 : s.k === 'out' ? -(1 - s.v) * 30 : 0;
      el.style.transform = `translateY(${y}px) scale(${(s.k === 'in' ? .85 + .15 * s.v : 1) * (1 + .06 * focus)})`;
    });

    // 4. Résidences 24h/24 : immeuble, fenêtres qui s'allument, pin qui tombe
    apply($('s4art'), t, 17.0, 21.7, { dy: 60 });
    apply($('s4a'), t, 17.3, 21.7);
    apply($('s4b'), t, 17.5, 21.7);
    apply($('s4c'), t, 18.2, 21.7, { z0: .7 });
    const lit = clamp((t - 17.2) / 2.4) * WINS.length;
    WINS.forEach((w, i) => w.setAttribute('fill', ORDER[i] < lit ? (ORDER[i] % 3 ? '#FFD9C7' : '#FF7A3D') : '#45455A'));
    const pd = t - 17.6, pin = $('s4pin');
    if (pd < 0) { pin.style.opacity = 0; }
    else {
      const p = clamp(pd / .45), drop = p < 1 ? -260 * (1 - easeIn(p)) : 0, bounce = pd > .45 && pd < .9 ? -Math.sin((pd - .45) / .45 * Math.PI) * 26 : 0;
      const fade = t >= 21.7 ? 1 - easeIn(clamp((t - 21.7) / TR)) : 1;
      pin.style.opacity = clamp(p * 3) * fade; pin.style.transform = `translateY(${drop + bounce}px)`;
    }

    // 5. Contact, puis fondu vers le fond neutre = première image (boucle propre)
    apply($('s5logo'), t, 22.0, 24.7, { dy: 30, z0: .8 });
    apply($('s5a'), t, 22.15, 24.7);
    apply($('s5b'), t, 22.3, 24.7);
    apply($('s5c'), t, 22.45, 24.7);
  }

  window.DURATION = DURATION; window.FPS = FPS; window.seek = seek;
  window.ready = Promise.all([document.fonts.load('800 80px Poppins'), document.fonts.load('600 40px Poppins'),
    ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))]).then(() => { seek(0); return true; });
  if (new URLSearchParams(location.search).get('play')) window.ready.then(() => {
    const t0 = performance.now(); (function loop() { seek((performance.now() - t0) / 1000); requestAnimationFrame(loop); })();
  });
})();
</script>
</body>
</html>
